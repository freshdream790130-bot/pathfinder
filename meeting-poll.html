<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FNL-PRAISE · 회의 일정 조율</title>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;900&display=swap');

:root {
  --p1: #6b45b8;
  --p2: #9b7dd4;
  --p3: #c4aef0;
  --p-light: #f4f0ff;
  --green: #4aaa84;
  --green-light: #e8f7f2;
  --red-light: #fdf0f0;
  --red: #d96b6b;
  --bg: #f7f5f2;
  --card: #ffffff;
  --border: #ede8e0;
  --border2: #d8d0c8;
  --txt: #2d2820;
  --txt2: #7a6f66;
  --txt3: #b0a89e;
  --r: 20px;
  --r2: 12px;
  --sh: 0 4px 20px rgba(80,50,30,.08);
  --sh2: 0 8px 32px rgba(80,50,30,.14);
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Noto Sans KR', -apple-system, sans-serif;
  background: var(--bg);
  color: var(--txt);
  min-height: 100vh;
}

/* ── Loading ── */
#loading {
  position: fixed; inset: 0; background: rgba(247,245,242,.92);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 14px; z-index: 200; font-size: 14px; color: var(--txt2);
}
.spinner {
  width: 28px; height: 28px;
  border: 3px solid var(--border2); border-top-color: var(--p1);
  border-radius: 50%; animation: spin .7s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ── Hero Header ── */
.hero {
  background: linear-gradient(145deg, #4e2e98 0%, #7c5cbf 50%, #a87ee0 100%);
  padding: 28px 20px 48px;
  text-align: center;
  position: relative;
  overflow: hidden;
}
.hero::before {
  content: '';
  position: absolute; inset: 0;
  background: radial-gradient(ellipse at 70% 20%, rgba(255,255,255,.12) 0%, transparent 60%),
              radial-gradient(ellipse at 20% 80%, rgba(255,255,255,.08) 0%, transparent 50%);
}
.hero-inner { position: relative; z-index: 1; }

/* Logo badge */
.logo-badge {
  display: inline-flex; flex-direction: column; align-items: center;
  background: rgba(255,255,255,.15); backdrop-filter: blur(10px);
  border: 1px solid rgba(255,255,255,.3);
  border-radius: 16px; padding: 10px 24px; margin-bottom: 14px;
}
.logo-fnl {
  font-size: 11px; font-weight: 900; letter-spacing: 4px;
  color: rgba(255,255,255,.7); line-height: 1;
}
.logo-praise {
  font-size: 20px; font-weight: 900; letter-spacing: 2px;
  color: #ffffff; line-height: 1.2;
}

.hero-title {
  font-size: 22px; font-weight: 700; color: white;
  margin-bottom: 6px; line-height: 1.4;
}
.hero-subtitle {
  font-size: 13px; color: rgba(255,255,255,.72); line-height: 1.6;
}
.hero-back {
  position: absolute; left: 16px; top: 20px; z-index: 2;
  background: rgba(255,255,255,.2); border: none; color: white;
  font-size: 20px; width: 36px; height: 36px; border-radius: 10px;
  cursor: pointer; display: none; align-items: center; justify-content: center;
  transition: background .15s;
}
.hero-back:hover { background: rgba(255,255,255,.3); }
.hero-settings {
  background: rgba(255,255,255,.2); border: 1px solid rgba(255,255,255,.3);
  color: white; font-size: 15px; padding: 6px 12px; border-radius: 10px;
  cursor: pointer; transition: background .15s; flex-shrink: 0;
}
.hero-settings:hover { background: rgba(255,255,255,.3); }

/* Floating card overlap */
.content-wrap {
  max-width: 680px; margin: 0 auto;
  padding: 20px 16px 60px; position: relative; z-index: 2;
}

/* ── Cards ── */
.card {
  background: var(--card); border-radius: var(--r);
  box-shadow: var(--sh); padding: 24px;
  margin-bottom: 16px; border: 1px solid var(--border);
}

/* Step header */
.step-head {
  display: flex; align-items: center; gap: 12px; margin-bottom: 18px;
}
.step-num-badge {
  width: 32px; height: 32px; border-radius: 50%;
  background: linear-gradient(135deg, var(--p1), var(--p2));
  color: white; font-size: 14px; font-weight: 700;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0; box-shadow: 0 3px 10px rgba(107,69,184,.35);
}
.step-title { font-size: 16px; font-weight: 700; color: var(--txt); }
.step-sub { font-size: 12px; color: var(--txt3); margin-top: 1px; }

/* ── Meeting list ── */
.meeting-item {
  display: flex; align-items: center; gap: 14px;
  padding: 16px 18px; background: var(--card); border-radius: var(--r2);
  box-shadow: var(--sh); margin-bottom: 12px;
  cursor: pointer; transition: all .2s;
  border: 1.5px solid var(--border);
}
.meeting-item:hover { box-shadow: var(--sh2); border-color: var(--p3); transform: translateY(-2px); }
.meet-icon {
  width: 48px; height: 48px; border-radius: 14px;
  background: linear-gradient(135deg, var(--p1), var(--p2));
  display: flex; align-items: center; justify-content: center;
  font-size: 22px; flex-shrink: 0; box-shadow: 0 4px 12px rgba(107,69,184,.3);
}
.meet-info { flex: 1; min-width: 0; }
.meet-title { font-weight: 700; font-size: 15px; color: var(--txt); }
.meet-meta { font-size: 12px; color: var(--txt3); margin-top: 4px; }
.meet-arrow { color: var(--p3); font-size: 22px; }

/* ── Name buttons ── */
.name-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 10px; }
.name-btn {
  padding: 13px 10px; border-radius: var(--r2);
  border: 2px solid var(--border);
  background: var(--bg); cursor: pointer;
  font-size: 14px; font-weight: 600; color: var(--txt);
  transition: all .2s; text-align: center;
  font-family: inherit;
}
.name-btn:hover { border-color: var(--p3); color: var(--p1); background: var(--p-light); transform: translateY(-1px); box-shadow: var(--sh); }
.name-btn.selected {
  border-color: var(--p1);
  background: linear-gradient(135deg, var(--p1), var(--p2));
  color: white; box-shadow: 0 5px 16px rgba(107,69,184,.35);
  transform: translateY(-2px);
}

/* ── Date cards ── */
.date-cards { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; }
.date-card {
  display: flex; align-items: center; gap: 16px;
  padding: 14px 18px; border-radius: var(--r2);
  border: 2px solid var(--border); background: var(--bg);
  cursor: pointer; transition: all .2s;
}
.date-card:hover { border-color: var(--p3); background: var(--p-light); }
.date-card.selected { border-color: var(--green); background: var(--green-light); }

.date-cal {
  width: 52px; flex-shrink: 0; border-radius: 10px;
  overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,.1);
}
.date-cal-top {
  background: linear-gradient(135deg, var(--p1), var(--p2));
  color: white; font-size: 9px; font-weight: 700;
  text-align: center; padding: 4px 2px; letter-spacing: .5px;
}
.date-card.selected .date-cal-top { background: linear-gradient(135deg, #3a8a6a, var(--green)); }
.date-cal-num {
  background: white; color: var(--txt);
  font-size: 22px; font-weight: 900;
  text-align: center; padding: 4px 2px 6px;
  line-height: 1;
}
.date-card.selected .date-cal-num { color: #2a6a50; }

.date-info { flex: 1; }
.date-main { font-size: 14px; font-weight: 700; color: var(--txt); }
.date-time { font-size: 12px; color: var(--txt3); margin-top: 2px; }
.date-check {
  width: 26px; height: 26px; border-radius: 50%;
  border: 2px solid var(--border2);
  display: flex; align-items: center; justify-content: center;
  font-size: 13px; flex-shrink: 0; transition: all .2s; color: transparent;
}
.date-card.selected .date-check { background: var(--green); border-color: var(--green); color: white; }

/* ── Summary table ── */
.grid-wrap { overflow-x: auto; border-radius: var(--r2); }
table.grid { border-collapse: collapse; min-width: 100%; font-size: 13px; }
table.grid th, table.grid td {
  padding: 11px 14px; border: 1px solid var(--border);
  text-align: center; white-space: nowrap;
}
table.grid th {
  background: var(--bg); font-weight: 700;
  color: var(--txt2); font-size: 12px; letter-spacing: .02em;
}
table.grid td:first-child { text-align: left; font-weight: 600; }
.cell-yes { background: var(--green-light); color: #2a6a50; font-weight: 700; font-size: 16px; }
.cell-no { background: var(--red-light); color: var(--red); }
.cell-pending { color: var(--txt3); }
.count-row td {
  background: var(--p-light); font-weight: 700;
  color: var(--p1); border-top: 2px solid var(--p3);
}
.my-row td:first-child { color: var(--p1); }
.my-row td:first-child::after { content: ' ★'; font-size: 11px; }

/* ── Buttons ── */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  padding: 12px 24px; border-radius: 50px; border: none;
  font-size: 14px; font-weight: 700; cursor: pointer;
  transition: all .2s; font-family: inherit;
}
.btn-primary {
  background: linear-gradient(135deg, var(--p1), var(--p2));
  color: white; box-shadow: 0 4px 14px rgba(107,69,184,.35);
}
.btn-primary:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(107,69,184,.45); }
.btn-success {
  background: linear-gradient(135deg, #3a8a6a, var(--green));
  color: white; box-shadow: 0 4px 14px rgba(74,170,132,.35);
}
.btn-success:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(74,170,132,.45); }
.btn-secondary {
  background: var(--bg); color: var(--txt2);
  border: 1.5px solid var(--border2);
}
.btn-secondary:hover { background: var(--border); }
.btn-danger { background: var(--red); color: white; }
.btn-outline {
  background: white; color: var(--p1);
  border: 1.5px solid var(--p3);
}
.btn-outline:hover { background: var(--p-light); }
.btn-sm { padding: 7px 16px; font-size: 13px; }
.btn-full { width: 100%; }

/* ── Forms ── */
.form-group { margin-bottom: 16px; }
label { display: block; font-size: 13px; font-weight: 600; color: var(--txt2); margin-bottom: 6px; }
input[type=text], input[type=date], textarea {
  width: 100%; padding: 11px 14px;
  border: 1.5px solid var(--border);
  border-radius: var(--r2); font-size: 14px;
  outline: none; background: var(--bg);
  color: var(--txt); transition: all .15s;
  font-family: inherit;
}
input:focus, textarea:focus { border-color: var(--p2); background: white; }
textarea { resize: vertical; min-height: 80px; }
.input-row { display: flex; gap: 8px; }
.input-row input { flex: 1; }

/* ── Tags ── */
.tag-list { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
.tag {
  display: inline-flex; align-items: center; gap: 6px;
  background: var(--p-light); color: var(--p1);
  border: 1px solid var(--p3);
  border-radius: 20px; padding: 5px 14px;
  font-size: 13px; font-weight: 500;
}
.tag .remove {
  cursor: pointer; opacity: .6; font-size: 15px;
  border: none; background: none; color: inherit; padding: 0;
}
.tag .remove:hover { opacity: 1; }

/* ── Share box ── */
.share-box {
  background: var(--bg); border: 1.5px solid var(--border);
  border-radius: var(--r2); padding: 12px 16px;
  display: flex; align-items: center; gap: 10px;
}
.share-box .url { flex: 1; font-size: 12px; color: var(--txt2); word-break: break-all; }
.copy-btn {
  flex-shrink: 0;
  background: linear-gradient(135deg, var(--p1), var(--p2));
  color: white; border: none; border-radius: 20px;
  padding: 7px 16px; font-size: 12px; font-weight: 700;
  cursor: pointer; font-family: inherit;
  box-shadow: 0 3px 10px rgba(107,69,184,.3);
}
.copy-btn:hover { opacity: .9; }

/* ── Alerts ── */
.alert { padding: 12px 16px; border-radius: var(--r2); font-size: 13px; margin-bottom: 16px; line-height: 1.6; }
.alert-info { background: var(--p-light); color: #4a2d90; border: 1px solid var(--p3); }
.alert-warn { background: #fff8ec; color: #8a6020; border: 1px solid #f5d898; }

/* ── Setup ── */
.setup-hero { text-align: center; padding: 32px 16px 20px; }
.setup-hero .emoji { font-size: 48px; margin-bottom: 10px; }
.setup-hero h2 { font-size: 20px; font-weight: 700; margin-bottom: 6px; }
.setup-hero p { font-size: 13px; color: var(--txt2); line-height: 1.6; }
.step-row { display: flex; gap: 14px; margin-bottom: 12px; align-items: flex-start; }
.step-dot {
  width: 26px; height: 26px; border-radius: 50%; flex-shrink: 0;
  background: linear-gradient(135deg, var(--p1), var(--p2));
  color: white; font-size: 12px; font-weight: 700;
  display: flex; align-items: center; justify-content: center; margin-top: 1px;
}
.step-row p { font-size: 14px; line-height: 1.6; color: var(--txt); }
.step-row a { color: var(--p1); }

/* ── Home header ── */
.list-header {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 16px;
}
.list-header h2 { font-size: 18px; font-weight: 700; }

/* ── Member panel ── */
.member-panel {
  background: var(--card); border-radius: var(--r);
  box-shadow: var(--sh); border: 1px solid var(--border);
  margin-bottom: 16px; overflow: hidden;
}
.member-panel-toggle {
  width: 100%; display: flex; align-items: center; gap: 12px;
  padding: 18px 22px; background: none; border: none; cursor: pointer;
  font-family: inherit; text-align: left;
}
.member-panel-toggle:hover { background: var(--bg); }
.member-panel-toggle .icon {
  width: 36px; height: 36px; border-radius: 10px;
  background: linear-gradient(135deg, var(--p1), var(--p2));
  display: flex; align-items: center; justify-content: center;
  font-size: 16px; flex-shrink: 0;
}
.member-panel-toggle .label { flex: 1; font-size: 15px; font-weight: 700; color: var(--txt); }
.member-panel-toggle .arrow { color: var(--txt3); font-size: 18px; transition: transform .2s; }
.member-panel-toggle.open .arrow { transform: rotate(90deg); }
.member-panel-body { display: none; padding: 0 22px 20px; border-top: 1px solid var(--border); }
.member-panel-body.open { display: block; }

/* ── Empty ── */
.empty {
  text-align: center; padding: 40px 20px;
  color: var(--txt3); font-size: 14px; line-height: 1.8;
}
.empty .big { font-size: 40px; margin-bottom: 10px; }

/* ── Best date banner ── */
.best-date-banner {
  background: linear-gradient(135deg, #3a8a6a, #5ec49a);
  border-radius: var(--r2); padding: 16px 20px;
  color: white; margin-bottom: 16px;
  display: flex; align-items: center; gap: 14px;
  box-shadow: 0 4px 16px rgba(58,138,106,.3);
}
.best-date-banner .crown { font-size: 28px; flex-shrink: 0; }
.best-date-banner .label { font-size: 11px; opacity: .8; margin-bottom: 2px; font-weight: 600; letter-spacing: .05em; }
.best-date-banner .value { font-size: 17px; font-weight: 700; }
.best-date-banner .count { margin-left: auto; text-align: center; flex-shrink: 0; }
.best-date-banner .count-num { font-size: 28px; font-weight: 900; line-height: 1; }
.best-date-banner .count-label { font-size: 11px; opacity: .8; }

/* ── Member tag (removable) ── */
.member-tag {
  display: inline-flex; align-items: center; gap: 6px;
  background: var(--p-light); color: var(--p1);
  border: 1px solid var(--p3);
  border-radius: 20px; padding: 5px 14px;
  font-size: 13px; font-weight: 500;
}
.member-tag .rm {
  cursor: pointer; opacity: .5; font-size: 15px;
  border: none; background: none; color: inherit; padding: 0;
}
.member-tag .rm:hover { opacity: 1; }

/* ── Toast ── */
.toast {
  position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%);
  background: var(--txt); color: white;
  padding: 11px 22px; border-radius: 30px;
  font-size: 13px; font-weight: 500;
  box-shadow: var(--sh2); z-index: 300;
  animation: toastIn .25s ease;
}
@keyframes toastIn { from { opacity:0; transform: translateX(-50%) translateY(10px); } to { opacity:1; transform: translateX(-50%) translateY(0); } }

@media(max-width:480px) {
  .hero { padding: 24px 16px 44px; }
  .content-wrap { padding: 0 12px 50px; }
  .card { padding: 18px; }
  .name-grid { grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); }
  .hero-title { font-size: 18px; }
}
</style>
</head>
<body>

<div id="loading">
  <div class="spinner"></div>
  <span>불러오는 중...</span>
</div>

<!-- HERO -->
<!-- 홈 전용 상단바 -->
<div id="homeBar" style="background:linear-gradient(135deg,#4e2e98,#7c5cbf);padding:16px 20px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:10;box-shadow:0 2px 12px rgba(100,70,160,.25);">
  <div style="display:flex;align-items:center;gap:10px">
    <div style="background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.3);border-radius:10px;padding:5px 14px;display:flex;flex-direction:column;align-items:center;line-height:1.2">
      <span style="font-size:9px;font-weight:900;letter-spacing:3px;color:rgba(255,255,255,.7)">MEET</span>
      <span style="font-size:14px;font-weight:900;letter-spacing:1px;color:white">ING</span>
    </div>
    <span style="color:white;font-size:15px;font-weight:600">회의일정수립</span>
  </div>
  <button onclick="showSetup()" style="background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.3);color:white;border-radius:8px;padding:6px 12px;cursor:pointer;font-size:14px">⚙</button>
</div>

<!-- 모임 전용 히어로 -->
<div class="hero" id="hero" style="display:none">
  <button class="hero-back" id="backBtn" onclick="goBack()">←</button>
  <div style="position:absolute;right:12px;top:14px;display:flex;gap:6px;z-index:2">
    <button class="hero-settings" id="memberBtn" onclick="toggleMemberModal()" style="display:none" title="멤버 관리">👥</button>
    <button class="hero-settings" id="adminBtn" onclick="promptAdminPin()" style="display:none" title="관리자">🔒</button>
  </div>
  <div class="hero-inner">
    <div class="logo-badge" id="logoBadge">
      <span class="logo-fnl" id="logoFnl">FNL</span>
      <span class="logo-praise" id="logoPraise">PRAISE</span>
    </div>
    <div class="hero-title" id="heroTitle"></div>
    <div class="hero-subtitle" id="heroSub"></div>
  </div>
</div>

<!-- 멤버 관리 모달 -->
<div id="memberModal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:150;align-items:flex-end;justify-content:center;">
  <div style="background:white;border-radius:20px 20px 0 0;padding:24px;width:100%;max-width:680px;max-height:70vh;overflow-y:auto;">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px">
      <div style="font-size:16px;font-weight:700">👥 멤버 관리</div>
      <button onclick="toggleMemberModal()" style="background:none;border:none;font-size:22px;cursor:pointer;color:var(--txt3)">×</button>
    </div>
    <div class="input-row" style="margin-bottom:12px">
      <input type="text" id="newMemberName" placeholder="이름 입력" onkeydown="if(event.key==='Enter')addMember()">
      <button class="btn btn-primary btn-sm" onclick="addMember()">추가</button>
    </div>
    <div class="tag-list" id="memberTagList"></div>
  </div>
</div>

<div class="content-wrap">
  <div id="app"></div>
</div>

<script>
let db = null;
let currentView = null;
let currentMeetingId = null;
let currentUser = null;

// ── Firebase ──────────────────────────────────────────────────
function initFirebase(config) {
  if (firebase.apps.length) {
    firebase.app().delete().then(() => _initFB(config));
  } else { _initFB(config); }
}
function _initFB(config) {
  try {
    firebase.initializeApp(config);
    db = firebase.database();
    localStorage.setItem('fbConfig', JSON.stringify(config));
    hideLoading(); routeFromHash();
  } catch(e) { hideLoading(); alert('Firebase 오류: ' + e.message); }
}

// ── Routing ───────────────────────────────────────────────────
window.addEventListener('hashchange', routeFromHash);
function routeFromHash() {
  const h = location.hash;
  if (h.startsWith('#meeting/')) showMeeting(h.slice(9));
  else if (h === '#create') showCreate();
  else if (h === '#setup') showSetupView();
  else showHome();
}
function goBack() {
  const ab = document.getElementById('adminBtn');
  const mb = document.getElementById('memberBtn');
  const mm = document.getElementById('memberModal');
  if (ab) { ab.style.display = 'none'; ab.textContent = '🔒'; }
  if (mb) mb.style.display = 'none';
  if (mm) mm.style.display = 'none';
  showHomeBar();
  location.hash = '#';
}

// ── Loading ───────────────────────────────────────────────────
function showLoading(msg) {
  document.getElementById('loading').style.display = 'flex';
  document.querySelector('#loading span').textContent = msg || '불러오는 중...';
}

function addDate() {
  const d = v('newDate'), t = v('newTime');
  if (!d) { alert('날짜를 선택하세요.'); return; }
  const label = addDow(d) + (t ? ' ' + t : '');
  if (newDates.find(x => x.label === label)) return;
  newDates.push({ label, date: d, time: t });
  renderTags();
  document.getElementById('newDate').value = '';
  document.getElementById('newTime').value = '';
}
function removeDate(i) { newDates.splice(i, 1); renderTags(); }
function addAttendee() {
  const name = v('newName').trim();
  if (!name) return;
  if (newAttendees.includes(name)) { alert('이미 있는 이름입니다.'); return; }
  newAttendees.push(name);
  renderTags();
  document.getElementById('newName').value = '';
}
function removeAttendee(i) { newAttendees.splice(i, 1); renderTags(); }
function renderTags() {
  const dl = document.getElementById('dateList');
  if (dl) dl.innerHTML = newDates.map((d,i) => `<span class="tag">${esc(d.label)}<button class="remove" onclick="removeDate(${i})">×</button></span>`).join('');
  const nl = document.getElementById('nameList');
  if (nl) nl.innerHTML = newAttendees.map((n,i) => `<span class="tag">${esc(n)}<button class="remove" onclick="removeAttendee(${i})">×</button></span>`).join('');
}
function createMeeting() {
  const title = v('meetingTitle').trim(), desc = v('meetingDesc').trim();
  const logoTitle = v('meetingLogoTitle').trim() || 'FNL-PRAISE';
  const logoSub = v('meetingLogoSub').trim() || '';
  if (!title) { alert('회의 제목을 입력하세요.'); return; }
  if (!newDates.length) { alert('후보 일정을 하나 이상 추가하세요.'); return; }
  if (!newAttendees.length) { alert('참석 대상자를 한 명 이상 추가하세요.'); return; }
  showLoading('회의 생성 중...');
  const pin = v('meetingPin').trim();
  const dObj = {}, aObj = {};
  newDates.forEach((d,i) => dObj['d'+i] = d);
  newAttendees.forEach((n,i) => aObj['a'+i] = n);
  // 회의 내용 수집
  const agendaObj = {};
  newAgendaItems.forEach((item,i) => { agendaObj['ag'+i] = item; });
  const filesObj = {};
  newFiles.forEach((f,i) => { filesObj['f'+i] = { name: f.name, data: f.data, type: f.type, size: f.size }; });
  const ref = db.ref('meetings').push();
  ref.set({ title, desc, logoTitle, logoSub, pin, dates: dObj, attendees: aObj, agenda: agendaObj, files: filesObj, createdAt: Date.now() })
    .then(() => { hideLoading(); location.hash = '#meeting/' + ref.key; })
    .catch(err => { hideLoading(); alert('오류: ' + err.message); });
}

}

function renderAgendaList() {

      <textarea placeholder="내용 (선택)" rows="2"
        oninput="newAgendaItems[${i}].content=this.value"
        style="width:100%;padding:8px 12px;border:1.5px solid var(--border);border-radius:8px;font-size:13px;font-family:inherit;resize:vertical;background:white">${esc(item.content)}</textarea>
    </div>
  `).join('');
}

function handleFileSelect(input) {
  const files = Array.from(input.files);
  files.forEach(file => {
    if (file.size > 10 * 1024 * 1024) { showToast(file.name + ' — 10MB 초과, 건너뜁니다.'); return; }
    const reader = new FileReader();
    reader.onload = e => {
      newFiles.push({ name: file.name, data: e.target.result, type: file.type, size: file.size });
      renderFileList();
    };
    reader.readAsDataURL(file);
  });
  input.value = '';
}
function removeFile(i) { newFiles.splice(i, 1); renderFileList(); }
function renderFileList() {
  const el = document.getElementById('fileList');
  if (!el) return;
  el.innerHTML = newFiles.map((f, i) => `
    <div style="display:flex;align-items:center;gap:8px;padding:7px 12px;background:var(--p-light);border-radius:8px;margin-bottom:6px;border:1px solid var(--p3)">
      <span style="font-size:14px">${fileIcon(f.type)}</span>
      <span style="font-size:13px;color:var(--p1);font-weight:500;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(f.name)}</span>
      <span style="font-size:11px;color:var(--txt3)">${(f.size/1024).toFixed(0)}KB</span>
      <button onclick="removeFile(${i})" style="background:none;border:none;color:var(--txt3);cursor:pointer;font-size:15px">×</button>
    </div>
  `).join('');
}
function fileIcon(type) {
  if (type.includes('image')) return '🖼️';
  if (type.includes('pdf')) return '📄';
  if (type.includes('word') || type.includes('document')) return '📝';
  if (type.includes('sheet') || type.includes('excel')) return '📊';
  if (type.includes('presentation') || type.includes('powerpoint')) return '📊';
  return '📎';
}

      </div>
      <button class="btn btn-success btn-full" onclick="submitResponse()">응답 저장하기</button>
    </div>

    <!-- 현황 -->
    <div class="card">
      <div class="step-head">
        <div class="step-num-badge">3</div>
        <div><div class="step-title">참석 현황</div><div class="step-sub">실시간 업데이트</div></div>
        <div style="margin-left:auto"><button class="btn btn-secondary btn-sm" onclick="loadSummary()">새로고침</button></div>
      </div>
      <div class="grid-wrap" id="summaryGrid"><div style="text-align:center;padding:24px"><div class="spinner" style="margin:0 auto"></div></div></div>
    </div>

    <!-- 최적 날짜 배너 -->
    <div class="best-date-banner" id="bestDateBanner" style="display:none"></div>

    <!-- 기본정보 수정 (PIN 인증 후 표시) -->
    <div id="adminPanel" style="display:none">
      <div class="member-panel">
        <button class="member-panel-toggle" id="editToggle" onclick="toggleEditPanel()">
          <div class="icon">✏️</div>
          <div class="label">기본정보 수정</div>
          <div class="arrow">›</div>
        </button>
        <div class="member-panel-body" id="editPanelBody">
          <div style="padding-top:16px">
            <div class="form-group"><label>로고 이름</label><input type="text" id="editLogoTitle" value="${esc(m.logoTitle||'FNL-PRAISE')}"></div>
            <div class="form-group"><label>로고 부제</label><textarea id="editLogoSub" rows="2">${esc(m.logoSub||'')}</textarea></div>
            <div class="form-group"><label>모임 제목</label><input type="text" id="editTitle" value="${esc(m.title||'')}"></div>
            <div class="form-group"><label>설명</label><textarea id="editDesc" rows="2">${esc(m.desc||'')}</textarea></div>
            <button class="btn btn-primary btn-full" onclick="saveEditInfo()">저장</button>
          </div>
        </div>
      </div>
    </div>


    <div style="text-align:center;margin-bottom:20px">
      <button class="btn btn-danger btn-sm" onclick="deleteMeeting()">이 모임 삭제</button>
    </div>
  `);
  loadSummary();
  listenResponses();
}

let selectedDates = new Set();
function selectUser(name) {
  currentUser = name;
  document.querySelectorAll('.name-btn').forEach(b => b.classList.toggle('selected', b.textContent === name));
  document.getElementById('selectedNameBadge').textContent = name + '님, 가능한 날짜를 선택해주세요';
  document.getElementById('responseCard').style.display = '';
  selectedDates.clear();
  db.ref('meetings/'+currentMeetingId+'/responses/'+encName(name)).once('value').then(snap => {
    if (snap.exists()) selectedDates = new Set(snap.val().available || []);
    refreshDateCards();
  });
}
function toggleDate(key) {
  selectedDates.has(key) ? selectedDates.delete(key) : selectedDates.add(key);
  refreshDateCards();
}
function refreshDateCards() {
  document.querySelectorAll('.date-card').forEach(el => {
    el.classList.toggle('selected', selectedDates.has(el.id.replace('opt_','')));
  });
}
function submitResponse() {
  if (!currentUser) { alert('이름을 먼저 선택하세요.'); return; }
  showLoading('저장 중...');
  db.ref('meetings/'+currentMeetingId+'/responses/'+encName(currentUser))
    .set({ name: currentUser, available: [...selectedDates], updatedAt: Date.now() })
    .then(() => { hideLoading(); loadSummary(); showToast('응답이 저장되었습니다! ✓'); })
    .catch(err => { hideLoading(); alert('오류: ' + err.message); });
}
function listenResponses() {
  responseListener = db.ref('meetings/'+currentMeetingId+'/responses');
  responseListener.on('value', () => loadSummary());
}
function loadSummary() {
  const m = meetingData;
  const dates = m.dates ? Object.entries(m.dates).sort((a,b) => a[1].date.localeCompare(b[1].date)) : [];
  const attendees = m.attendees ? Object.values(m.attendees) : [];
  db.ref('meetings/'+currentMeetingId+'/responses').once('value').then(snap => {
    const res = {};
    snap.forEach(c => { const r = c.val(); res[r.name] = new Set(r.available||[]); });
    const counts = {}; dates.forEach(([k]) => counts[k] = 0);
    const rows = attendees.map(name => {
      const avail = res[name];
      const isMe = name === currentUser;
      return `<tr class="${isMe?'my-row':''}"><td>${esc(name)}</td>${dates.map(([k]) => {
        if (!avail) return `<td class="cell-pending">-</td>`;
        const ok = avail.has(k);
        if (ok) counts[k]++;
        return `<td class="${ok?'cell-yes':'cell-no'}">${ok?'○':'✕'}</td>`;
      }).join('')}</tr>`;
    }).join('');
    const el = document.getElementById('summaryGrid');
    if (el) el.innerHTML = `<table class="grid"><thead><tr><th>이름</th>${dates.map(([k,d])=>`<th>${esc(addDow(d.date)||d.label)}${d.time?'<br><span style="font-weight:400;font-size:11px">'+esc(d.time)+'</span>':''}</th>`).join('')}</tr></thead><tbody>${rows}<tr class="count-row"><td>가능 인원</td>${dates.map(([k])=>`<td>${counts[k]}명</td>`).join('')}</tr></tbody></table>`;

    // 최적 날짜 배너
    const maxCount = Math.max(...Object.values(counts), 0);
    const bestKey = dates.find(([k]) => counts[k] === maxCount);
    const bannerEl = document.getElementById('bestDateBanner');
    if (bannerEl && bestKey && maxCount > 0) {
      const bd = bestKey[1];
      bannerEl.style.display = 'flex';
      bannerEl.innerHTML = `
        <div class="crown">🏆</div>
        <div>
          <div class="label">가장 많이 가능한 날짜</div>
          <div class="value">${esc(addDow(bd.date)||bd.label)}${bd.time?' · '+esc(bd.time):''}</div>
        </div>
        <div class="count">
          <div class="count-num">${maxCount}</div>
          <div class="count-label">명 가능</div>
        </div>`;
    } else if (bannerEl) {
      bannerEl.style.display = 'none';
    }
  });
}

// ── 기본정보 수정 (주최자 PIN 인증) ──────────────────────────
function promptAdminPin() {
  const pin = prompt('주최자 PIN을 입력하세요:');
  if (pin === null) return;
  if (pin === String(meetingData.pin)) {
    const panel = document.getElementById('adminPanel');
    if (panel) {
      panel.style.display = '';
      panel.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }
    // 버튼 잠금 해제 표시
    const adminBtn = document.getElementById('adminBtn');
    if (adminBtn) adminBtn.textContent = '🔓';
    showToast('관리자 모드 활성화');
  } else {
    alert('PIN이 올바르지 않습니다.');
  }
}

function toggleEditPanel() {
  const toggle = document.getElementById('editToggle');
  const body = document.getElementById('editPanelBody');
  if (!toggle || !body) return;
  const isOpen = body.classList.contains('open');
  toggle.classList.toggle('open', !isOpen);
  body.classList.toggle('open', !isOpen);
}

function saveEditInfo() {
  const logoTitle = v('editLogoTitle').trim();
  const logoSub = v('editLogoSub').trim();
  const title = v('editTitle').trim();
  const desc = v('editDesc').trim();
  if (!title) { alert('모임 제목을 입력하세요.'); return; }
  showLoading('저장 중...');
  db.ref('meetings/'+currentMeetingId).update({ logoTitle, logoSub, title, desc }).then(() => {
    // 데이터 업데이트
    meetingData.logoTitle = logoTitle;
    meetingData.logoSub = logoSub;
    meetingData.title = title;
    meetingData.desc = desc;
    // 헤로 즉시 반영
    updateHeroFromData();
    hideLoading();
    showToast('저장되었습니다! ✓');
  }).catch(err => { hideLoading(); alert('오류: ' + err.message); });
}

function updateHeroFromData() {
  const logoTitle = meetingData.logoTitle || 'FNL-PRAISE';
  // 로고 배지 업데이트
  const parts = logoTitle.split(/[-\s]/);
  const top = parts[0] || 'FNL';
  const bot = parts.slice(1).join(' ') || logoTitle;
  const logoFnl = document.getElementById('logoFnl');
  const logoPraise = document.getElementById('logoPraise');
  if (logoFnl) logoFnl.textContent = top;
  if (logoPraise) logoPraise.textContent = bot;
  // 헤로 타이틀 = 로고 부제, 헤로 서브 = 설명
  const heroTitleEl = document.getElementById('heroTitle');
  const heroSubEl = document.getElementById('heroSub');
  if (heroTitleEl) heroTitleEl.textContent = meetingData.logoSub || meetingData.title || '';
  if (heroSubEl) heroSubEl.innerHTML = meetingData.desc ? meetingData.desc.replace(/\n/g,'<br>') : '';
  const ab = document.getElementById('adminBtn');
  const mb = document.getElementById('memberBtn');
  if (ab) ab.style.display = meetingData.pin ? '' : 'none';
  if (mb) mb.style.display = '';
}

// ── 멤버 관리 (모달) ─────────────────────────────────────────
function toggleMemberModal() {
  const modal = document.getElementById('memberModal');
  const isOpen = modal.style.display === 'flex';
  modal.style.display = isOpen ? 'none' : 'flex';
  if (!isOpen) renderMemberTags();
}

function addMember() {
  const name = v('newMemberName').trim();
  if (!name) return;
  const attendees = meetingData.attendees ? Object.values(meetingData.attendees) : [];
  if (attendees.includes(name)) { showToast('이미 있는 멤버입니다.'); return; }
  const newKey = 'a' + Date.now();
  db.ref('meetings/'+currentMeetingId+'/attendees/'+newKey).set(name).then(() => {
    if (!meetingData.attendees) meetingData.attendees = {};
    meetingData.attendees[newKey] = name;
    document.getElementById('newMemberName').value = '';
    renderMemberTags();
    // 이름 선택 버튼도 갱신
    const ng = document.querySelector('.name-grid');
    if (ng) ng.innerHTML = Object.values(meetingData.attendees).map(n =>
      `<button class="name-btn${currentUser===n?' selected':''}" onclick="selectUser('${esc(n)}')">${esc(n)}</button>`
    ).join('');
    showToast(name + ' 님이 추가되었습니다!');
  });
}

function removeMember(key) {
  const name = meetingData.attendees[key];
  if (!confirm(name + ' 님을 삭제할까요?')) return;
  db.ref('meetings/'+currentMeetingId+'/attendees/'+key).remove().then(() => {
    delete meetingData.attendees[key];
    renderMemberTags();
    const ng = document.querySelector('.name-grid');
    if (ng) ng.innerHTML = Object.values(meetingData.attendees).map(n =>
      `<button class="name-btn${currentUser===n?' selected':''}" onclick="selectUser('${esc(n)}')">${esc(n)}</button>`
    ).join('');
    showToast(name + ' 님이 삭제되었습니다.');
  });
}

function renderMemberTags() {
  const el = document.getElementById('memberTagList');
  if (!el || !meetingData.attendees) return;
  el.innerHTML = Object.entries(meetingData.attendees).map(([k, n]) =>
    `<span class="member-tag">${esc(n)}<button class="rm" onclick="removeMember('${k}')">×</button></span>`
  ).join('');
}
function deleteMeeting() {
  if (!confirm('이 회의를 삭제하시겠습니까?')) return;
  showLoading('삭제 중...');
  db.ref('meetings/'+currentMeetingId).remove().then(() => { hideLoading(); location.hash = '#'; });
}

// ── Utils ─────────────────────────────────────────────────────
function render(html) { document.getElementById('app').innerHTML = html; }
function v(id) { const e = document.getElementById(id); return e ? e.value : ''; }
function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function today() { return new Date().toISOString().slice(0,10); }
function addDow(dateStr) {
  if (!dateStr || !dateStr.match(/^\d{4}-\d{2}-\d{2}/)) return dateStr;
  const days = ['일','월','화','수','목','금','토'];
  const d = new Date(dateStr.slice(0,10) + 'T00:00:00');
  return dateStr + ' (' + days[d.getDay()] + ')';
}
function encName(n) { return encodeURIComponent(n).replace(/\./g,'%2E'); }
function copyUrl(url) { navigator.clipboard.writeText(url).then(() => showToast('링크가 복사되었습니다!')); }
function showToast(msg) {
  const t = document.createElement('div');
  t.className = 'toast'; t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 2500);
}
