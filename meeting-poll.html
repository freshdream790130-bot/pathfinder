<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FNL-PRAISE · 회의 일정 조율</title>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;900&display=swap');

:root {
  --p1: #6b45b8;
  --p2: #9b7dd4;
  --p3: #c4aef0;
  --p-light: #f4f0ff;
  --green: #4aaa84;
  --green-light: #e8f7f2;
  --red-light: #fdf0f0;
  --red: #d96b6b;
  --bg: #f7f5f2;
  --card: #ffffff;
  --border: #ede8e0;
  --border2: #d8d0c8;
  --txt: #2d2820;
  --txt2: #7a6f66;
  --txt3: #b0a89e;
  --r: 20px;
  --r2: 12px;
  --sh: 0 4px 20px rgba(80,50,30,.08);
  --sh2: 0 8px 32px rgba(80,50,30,.14);
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Noto Sans KR', -apple-system, sans-serif;
  background: var(--bg);
  color: var(--txt);
  min-height: 100vh;
}

/* ── Loading ── */
#loading {
  position: fixed; inset: 0; background: rgba(247,245,242,.92);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 14px; z-index: 200; font-size: 14px; color: var(--txt2);
}
.spinner {
  width: 28px; height: 28px;
  border: 3px solid var(--border2); border-top-color: var(--p1);
  border-radius: 50%; animation: spin .7s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ── Hero Header ── */
.hero {
  background: linear-gradient(145deg, #4e2e98 0%, #7c5cbf 50%, #a87ee0 100%);
  padding: 28px 20px 48px;
  text-align: center;
  position: relative;
  overflow: hidden;
}
.hero::before {
  content: '';
  position: absolute; inset: 0;
  background: radial-gradient(ellipse at 70% 20%, rgba(255,255,255,.12) 0%, transparent 60%),
              radial-gradient(ellipse at 20% 80%, rgba(255,255,255,.08) 0%, transparent 50%);
}
.hero-inner { position: relative; z-index: 1; }

/* Logo badge */
.logo-badge {
  display: inline-flex; flex-direction: column; align-items: center;
  background: rgba(255,255,255,.15); backdrop-filter: blur(10px);
  border: 1px solid rgba(255,255,255,.3);
  border-radius: 16px; padding: 10px 24px; margin-bottom: 14px;
}
.logo-fnl {
  font-size: 11px; font-weight: 900; letter-spacing: 4px;
  color: rgba(255,255,255,.7); line-height: 1;
}
.logo-praise {
  font-size: 20px; font-weight: 900; letter-spacing: 2px;
  color: #ffffff; line-height: 1.2;
}

.hero-title {
  font-size: 22px; font-weight: 700; color: white;
  margin-bottom: 6px; line-height: 1.4;
}
.hero-subtitle {
  font-size: 13px; color: rgba(255,255,255,.72); line-height: 1.6;
}
.hero-back {
  position: absolute; left: 16px; top: 20px; z-index: 2;
  background: rgba(255,255,255,.2); border: none; color: white;
  font-size: 20px; width: 36px; height: 36px; border-radius: 10px;
  cursor: pointer; display: none; align-items: center; justify-content: center;
  transition: background .15s;
}
.hero-back:hover { background: rgba(255,255,255,.3); }
.hero-settings {
  position: absolute; right: 16px; top: 20px; z-index: 2;
  background: rgba(255,255,255,.2); border: 1px solid rgba(255,255,255,.3);
  color: white; font-size: 15px; padding: 6px 12px; border-radius: 10px;
  cursor: pointer; transition: background .15s;
}
.hero-settings:hover { background: rgba(255,255,255,.3); }

/* Floating card overlap */
.content-wrap {
  max-width: 680px; margin: -24px auto 0;
  padding: 0 16px 60px; position: relative; z-index: 2;
}

/* ── Cards ── */
.card {
  background: var(--card); border-radius: var(--r);
  box-shadow: var(--sh); padding: 24px;
  margin-bottom: 16px; border: 1px solid var(--border);
}

/* Step header */
.step-head {
  display: flex; align-items: center; gap: 12px; margin-bottom: 18px;
}
.step-num-badge {
  width: 32px; height: 32px; border-radius: 50%;
  background: linear-gradient(135deg, var(--p1), var(--p2));
  color: white; font-size: 14px; font-weight: 700;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0; box-shadow: 0 3px 10px rgba(107,69,184,.35);
}
.step-title { font-size: 16px; font-weight: 700; color: var(--txt); }
.step-sub { font-size: 12px; color: var(--txt3); margin-top: 1px; }

/* ── Meeting list ── */
.meeting-item {
  display: flex; align-items: center; gap: 14px;
  padding: 16px 18px; background: var(--card); border-radius: var(--r2);
  box-shadow: var(--sh); margin-bottom: 12px;
  cursor: pointer; transition: all .2s;
  border: 1.5px solid var(--border);
}
.meeting-item:hover { box-shadow: var(--sh2); border-color: var(--p3); transform: translateY(-2px); }
.meet-icon {
  width: 48px; height: 48px; border-radius: 14px;
  background: linear-gradient(135deg, var(--p1), var(--p2));
  display: flex; align-items: center; justify-content: center;
  font-size: 22px; flex-shrink: 0; box-shadow: 0 4px 12px rgba(107,69,184,.3);
}
.meet-info { flex: 1; min-width: 0; }
.meet-title { font-weight: 700; font-size: 15px; color: var(--txt); }
.meet-meta { font-size: 12px; color: var(--txt3); margin-top: 4px; }
.meet-arrow { color: var(--p3); font-size: 22px; }

/* ── Name buttons ── */
.name-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 10px; }
.name-btn {
  padding: 13px 10px; border-radius: var(--r2);
  border: 2px solid var(--border);
  background: var(--bg); cursor: pointer;
  font-size: 14px; font-weight: 600; color: var(--txt);
  transition: all .2s; text-align: center;
  font-family: inherit;
}
.name-btn:hover { border-color: var(--p3); color: var(--p1); background: var(--p-light); transform: translateY(-1px); box-shadow: var(--sh); }
.name-btn.selected {
  border-color: var(--p1);
  background: linear-gradient(135deg, var(--p1), var(--p2));
  color: white; box-shadow: 0 5px 16px rgba(107,69,184,.35);
  transform: translateY(-2px);
}

/* ── Date cards ── */
.date-cards { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; }
.date-card {
  display: flex; align-items: center; gap: 16px;
  padding: 14px 18px; border-radius: var(--r2);
  border: 2px solid var(--border); background: var(--bg);
  cursor: pointer; transition: all .2s;
}
.date-card:hover { border-color: var(--p3); background: var(--p-light); }
.date-card.selected { border-color: var(--green); background: var(--green-light); }

.date-cal {
  width: 52px; flex-shrink: 0; border-radius: 10px;
  overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,.1);
}
.date-cal-top {
  background: linear-gradient(135deg, var(--p1), var(--p2));
  color: white; font-size: 9px; font-weight: 700;
  text-align: center; padding: 4px 2px; letter-spacing: .5px;
}
.date-card.selected .date-cal-top { background: linear-gradient(135deg, #3a8a6a, var(--green)); }
.date-cal-num {
  background: white; color: var(--txt);
  font-size: 22px; font-weight: 900;
  text-align: center; padding: 4px 2px 6px;
  line-height: 1;
}
.date-card.selected .date-cal-num { color: #2a6a50; }

.date-info { flex: 1; }
.date-main { font-size: 14px; font-weight: 700; color: var(--txt); }
.date-time { font-size: 12px; color: var(--txt3); margin-top: 2px; }
.date-check {
  width: 26px; height: 26px; border-radius: 50%;
  border: 2px solid var(--border2);
  display: flex; align-items: center; justify-content: center;
  font-size: 13px; flex-shrink: 0; transition: all .2s; color: transparent;
}
.date-card.selected .date-check { background: var(--green); border-color: var(--green); color: white; }

/* ── Summary table ── */
.grid-wrap { overflow-x: auto; border-radius: var(--r2); }
table.grid { border-collapse: collapse; min-width: 100%; font-size: 13px; }
table.grid th, table.grid td {
  padding: 11px 14px; border: 1px solid var(--border);
  text-align: center; white-space: nowrap;
}
table.grid th {
  background: var(--bg); font-weight: 700;
  color: var(--txt2); font-size: 12px; letter-spacing: .02em;
}
table.grid td:first-child { text-align: left; font-weight: 600; }
.cell-yes { background: var(--green-light); color: #2a6a50; font-weight: 700; font-size: 16px; }
.cell-no { background: var(--red-light); color: var(--red); }
.cell-pending { color: var(--txt3); }
.count-row td {
  background: var(--p-light); font-weight: 700;
  color: var(--p1); border-top: 2px solid var(--p3);
}
.my-row td:first-child { color: var(--p1); }
.my-row td:first-child::after { content: ' ★'; font-size: 11px; }

/* ── Buttons ── */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  padding: 12px 24px; border-radius: 50px; border: none;
  font-size: 14px; font-weight: 700; cursor: pointer;
  transition: all .2s; font-family: inherit;
}
.btn-primary {
  background: linear-gradient(135deg, var(--p1), var(--p2));
  color: white; box-shadow: 0 4px 14px rgba(107,69,184,.35);
}
.btn-primary:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(107,69,184,.45); }
.btn-success {
  background: linear-gradient(135deg, #3a8a6a, var(--green));
  color: white; box-shadow: 0 4px 14px rgba(74,170,132,.35);
}
.btn-success:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(74,170,132,.45); }
.btn-secondary {
  background: var(--bg); color: var(--txt2);
  border: 1.5px solid var(--border2);
}
.btn-secondary:hover { background: var(--border); }
.btn-danger { background: var(--red); color: white; }
.btn-outline {
  background: white; color: var(--p1);
  border: 1.5px solid var(--p3);
}
.btn-outline:hover { background: var(--p-light); }
.btn-sm { padding: 7px 16px; font-size: 13px; }
.btn-full { width: 100%; }

/* ── Forms ── */
.form-group { margin-bottom: 16px; }
label { display: block; font-size: 13px; font-weight: 600; color: var(--txt2); margin-bottom: 6px; }
input[type=text], input[type=date], textarea {
  width: 100%; padding: 11px 14px;
  border: 1.5px solid var(--border);
  border-radius: var(--r2); font-size: 14px;
  outline: none; background: var(--bg);
  color: var(--txt); transition: all .15s;
  font-family: inherit;
}
input:focus, textarea:focus { border-color: var(--p2); background: white; }
textarea { resize: vertical; min-height: 80px; }
.input-row { display: flex; gap: 8px; }
.input-row input { flex: 1; }

/* ── Tags ── */
.tag-list { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
.tag {
  display: inline-flex; align-items: center; gap: 6px;
  background: var(--p-light); color: var(--p1);
  border: 1px solid var(--p3);
  border-radius: 20px; padding: 5px 14px;
  font-size: 13px; font-weight: 500;
}
.tag .remove {
  cursor: pointer; opacity: .6; font-size: 15px;
  border: none; background: none; color: inherit; padding: 0;
}
.tag .remove:hover { opacity: 1; }

/* ── Share box ── */
.share-box {
  background: var(--bg); border: 1.5px solid var(--border);
  border-radius: var(--r2); padding: 12px 16px;
  display: flex; align-items: center; gap: 10px;
}
.share-box .url { flex: 1; font-size: 12px; color: var(--txt2); word-break: break-all; }
.copy-btn {
  flex-shrink: 0;
  background: linear-gradient(135deg, var(--p1), var(--p2));
  color: white; border: none; border-radius: 20px;
  padding: 7px 16px; font-size: 12px; font-weight: 700;
  cursor: pointer; font-family: inherit;
  box-shadow: 0 3px 10px rgba(107,69,184,.3);
}
.copy-btn:hover { opacity: .9; }

/* ── Alerts ── */
.alert { padding: 12px 16px; border-radius: var(--r2); font-size: 13px; margin-bottom: 16px; line-height: 1.6; }
.alert-info { background: var(--p-light); color: #4a2d90; border: 1px solid var(--p3); }
.alert-warn { background: #fff8ec; color: #8a6020; border: 1px solid #f5d898; }

/* ── Setup ── */
.setup-hero { text-align: center; padding: 32px 16px 20px; }
.setup-hero .emoji { font-size: 48px; margin-bottom: 10px; }
.setup-hero h2 { font-size: 20px; font-weight: 700; margin-bottom: 6px; }
.setup-hero p { font-size: 13px; color: var(--txt2); line-height: 1.6; }
.step-row { display: flex; gap: 14px; margin-bottom: 12px; align-items: flex-start; }
.step-dot {
  width: 26px; height: 26px; border-radius: 50%; flex-shrink: 0;
  background: linear-gradient(135deg, var(--p1), var(--p2));
  color: white; font-size: 12px; font-weight: 700;
  display: flex; align-items: center; justify-content: center; margin-top: 1px;
}
.step-row p { font-size: 14px; line-height: 1.6; color: var(--txt); }
.step-row a { color: var(--p1); }

/* ── Home header ── */
.list-header {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 16px;
}
.list-header h2 { font-size: 18px; font-weight: 700; }

/* ── Empty ── */
.empty {
  text-align: center; padding: 40px 20px;
  color: var(--txt3); font-size: 14px; line-height: 1.8;
}
.empty .big { font-size: 40px; margin-bottom: 10px; }

/* ── Toast ── */
.toast {
  position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%);
  background: var(--txt); color: white;
  padding: 11px 22px; border-radius: 30px;
  font-size: 13px; font-weight: 500;
  box-shadow: var(--sh2); z-index: 300;
  animation: toastIn .25s ease;
}
@keyframes toastIn { from { opacity:0; transform: translateX(-50%) translateY(10px); } to { opacity:1; transform: translateX(-50%) translateY(0); } }

@media(max-width:480px) {
  .hero { padding: 24px 16px 44px; }
  .content-wrap { padding: 0 12px 50px; }
  .card { padding: 18px; }
  .name-grid { grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); }
  .hero-title { font-size: 18px; }
}
</style>
</head>
<body>

<div id="loading">
  <div class="spinner"></div>
  <span>불러오는 중...</span>
</div>

<!-- HERO -->
<div class="hero" id="hero">
  <button class="hero-back" id="backBtn" onclick="goBack()">←</button>
  <button class="hero-settings" id="settingsBtn" onclick="showSetup()">⚙</button>
  <div class="hero-inner">
    <div class="logo-badge">
      <span class="logo-fnl">FNL</span>
      <span class="logo-praise">PRAISE</span>
    </div>
    <div class="hero-title" id="heroTitle">금요일작은찬양팀 정기모임</div>
    <div class="hero-subtitle" id="heroSub">✦ 일상과 기도제목 나누기<br>✦ 찬양팀 운영, 연습, 선곡 및 예배 형식 관련 논의</div>
  </div>
</div>

<div class="content-wrap">
  <div id="app"></div>
</div>

<script>
let db = null;
let currentView = null;
let currentMeetingId = null;
let currentUser = null;

// ── Firebase ──────────────────────────────────────────────────
function initFirebase(config) {
  if (firebase.apps.length) {
    firebase.app().delete().then(() => _initFB(config));
  } else { _initFB(config); }
}
function _initFB(config) {
  try {
    firebase.initializeApp(config);
    db = firebase.database();
    localStorage.setItem('fbConfig', JSON.stringify(config));
    hideLoading(); routeFromHash();
  } catch(e) { hideLoading(); alert('Firebase 오류: ' + e.message); }
}

// ── Routing ───────────────────────────────────────────────────
window.addEventListener('hashchange', routeFromHash);
function routeFromHash() {
  const h = location.hash;
  if (h.startsWith('#meeting/')) showMeeting(h.slice(9));
  else if (h === '#create') showCreate();
  else if (h === '#setup') showSetupView();
  else showHome();
}
function goBack() { location.hash = '#'; }

// ── Loading ───────────────────────────────────────────────────
function showLoading(msg) {
  document.getElementById('loading').style.display = 'flex';
  document.querySelector('#loading span').textContent = msg || '불러오는 중...';
}
function hideLoading() { document.getElementById('loading').style.display = 'none'; }

// ── Hero helpers ──────────────────────────────────────────────
function setHero(title, sub, back) {
  document.getElementById('heroTitle').textContent = title;
  document.getElementById('heroSub').innerHTML = sub || '';
  document.getElementById('backBtn').style.display = back ? 'flex' : 'none';
}
function setHeroHTML(title, sub, back) { setHero(title, sub, back); }

// ── Setup ─────────────────────────────────────────────────────
function showSetup() { location.hash = '#setup'; }
function showSetupView() {
  currentView = 'setup';
  setHero('Firebase 설정', '데이터 연결 구성', !!db);
  const saved = JSON.parse(localStorage.getItem('fbConfig') || '{}');
  render(`
    <div class="setup-hero">
      <div class="emoji">🔥</div>
      <h2>Firebase 연결 설정</h2>
      <p>데이터를 실시간으로 공유하려면 무료 Firebase 프로젝트가 필요합니다.</p>
    </div>
    <div class="card">
      <div class="step-row"><div class="step-dot">1</div><p><a href="https://console.firebase.google.com" target="_blank">Firebase Console</a>에서 새 프로젝트 생성</p></div>
      <div class="step-row"><div class="step-dot">2</div><p>Realtime Database → 데이터베이스 만들기 (테스트 모드)</p></div>
      <div class="step-row"><div class="step-dot">3</div><p>프로젝트 설정 → 앱 추가(&lt;/&gt;) → 웹앱 등록 후 설정값 복사</p></div>
      <div class="step-row"><div class="step-dot">4</div><p>아래에 붙여넣고 저장</p></div>
    </div>
    <div class="card">
      <div class="alert alert-info">Firebase 콘솔 → 프로젝트 설정 → 내 앱 → SDK 설정 및 구성</div>
      <div class="form-group"><label>API Key</label><input type="text" id="fb_apiKey" placeholder="AIzaSy..." value="${saved.apiKey||''}"></div>
      <div class="form-group"><label>Auth Domain</label><input type="text" id="fb_authDomain" placeholder="your-app.firebaseapp.com" value="${saved.authDomain||''}"></div>
      <div class="form-group"><label>Database URL</label><input type="text" id="fb_databaseURL" placeholder="https://your-app-default-rtdb.firebaseio.com" value="${saved.databaseURL||''}"></div>
      <div class="form-group"><label>Project ID</label><input type="text" id="fb_projectId" placeholder="your-app" value="${saved.projectId||''}"></div>
      <div class="form-group"><label>Storage Bucket</label><input type="text" id="fb_storageBucket" placeholder="your-app.appspot.com" value="${saved.storageBucket||''}"></div>
      <div class="form-group"><label>Messaging Sender ID</label><input type="text" id="fb_messagingSenderId" placeholder="123456789" value="${saved.messagingSenderId||''}"></div>
      <div class="form-group"><label>App ID</label><input type="text" id="fb_appId" placeholder="1:123:web:abc" value="${saved.appId||''}"></div>
      <button class="btn btn-primary btn-full" onclick="saveFirebaseConfig()">저장하고 연결</button>
    </div>
  `);
}
function saveFirebaseConfig() {
  const config = { apiKey:v('fb_apiKey'), authDomain:v('fb_authDomain'), databaseURL:v('fb_databaseURL'), projectId:v('fb_projectId'), storageBucket:v('fb_storageBucket'), messagingSenderId:v('fb_messagingSenderId'), appId:v('fb_appId') };
  if (!config.apiKey || !config.databaseURL) { alert('API Key와 Database URL은 필수입니다.'); return; }
  showLoading('연결 중...');
  initFirebase(config);
}

// ── Home ──────────────────────────────────────────────────────
function showHome() {
  currentView = 'home'; currentMeetingId = null; currentUser = null;
  setHeroHTML('금요일작은찬양팀 정기모임', '✦ 일상과 기도제목 나누기<br>✦ 찬양팀 운영, 연습, 선곡 및 예배 형식 관련 논의', false);
  if (!db) { showSetupView(); return; }
  showLoading('불러오는 중...');
  db.ref('meetings').orderByChild('createdAt').once('value').then(snap => {
    hideLoading();
    const list = [];
    snap.forEach(c => list.unshift({ id: c.key, ...c.val() }));
    let html = '';
    if (!list.length) {
      html = `<div class="empty"><div class="big">📋</div>아직 등록된 회의가 없습니다.<br>첫 회의를 만들어보세요!</div>`;
    } else {
      html = list.map(m => {
        const dc = m.dates ? Object.keys(m.dates).length : 0;
        const pc = m.attendees ? Object.keys(m.attendees).length : 0;
        const rc = m.responses ? Object.keys(m.responses).length : 0;
        return `<div class="meeting-item" onclick="location.hash='#meeting/${m.id}'">
          <div class="meet-icon">📋</div>
          <div class="meet-info">
            <div class="meet-title">${esc(m.title)}</div>
            <div class="meet-meta">일정 ${dc}개 · 대상자 ${pc}명 · 응답 ${rc}명</div>
          </div>
          <div class="meet-arrow">›</div>
        </div>`;
      }).join('');
    }
    render(`
      <div class="list-header">
        <h2>회의 목록</h2>
        <button class="btn btn-primary btn-sm" onclick="location.hash='#create'">+ 새 회의</button>
      </div>
      ${html}
    `);
  }).catch(err => {
    hideLoading();
    render(`<div class="alert alert-warn">${err.message.includes('permission') ? 'Firebase 권한 오류 — Realtime Database 규칙을 테스트 모드로 설정하세요.' : '오류: ' + err.message}</div>`);
  });
}

// ── Create ────────────────────────────────────────────────────
let newDates = [], newAttendees = [];
function showCreate() {
  if (!db) { showSetupView(); return; }
  currentView = 'create'; newDates = []; newAttendees = [];
  setHero('새 회의 만들기', '일정과 참석자를 입력하세요', true);
  render(`
    <div class="card">
      <div class="step-head"><div class="step-num-badge">1</div><div><div class="step-title">기본 정보</div></div></div>
      <div class="form-group"><label>회의 제목</label><input type="text" id="meetingTitle" placeholder="예: 5월 정기 팀 회의"></div>
      <div class="form-group"><label>설명 (선택)</label><textarea id="meetingDesc" placeholder="회의 안건, 장소 등 추가 정보"></textarea></div>
    </div>
    <div class="card">
      <div class="step-head"><div class="step-num-badge">2</div><div><div class="step-title">후보 일정</div><div class="step-sub">여러 날짜 추가 가능</div></div></div>
      <div class="input-row">
        <input type="date" id="newDate" min="${today()}">
        <input type="text" id="newTime" placeholder="시간 예: 14:00~16:00" style="max-width:160px">
        <button class="btn btn-secondary btn-sm" onclick="addDate()">추가</button>
      </div>
      <div class="tag-list" id="dateList"></div>
    </div>
    <div class="card">
      <div class="step-head"><div class="step-num-badge">3</div><div><div class="step-title">참석 대상자</div><div class="step-sub">이름을 한 명씩 추가하세요</div></div></div>
      <div class="input-row">
        <input type="text" id="newName" placeholder="이름 입력" onkeydown="if(event.key==='Enter')addAttendee()">
        <button class="btn btn-secondary btn-sm" onclick="addAttendee()">추가</button>
      </div>
      <div class="tag-list" id="nameList"></div>
    </div>
    <button class="btn btn-primary btn-full" style="margin-bottom:20px" onclick="createMeeting()">회의 만들기</button>
  `);
}
function addDate() {
  const d = v('newDate'), t = v('newTime');
  if (!d) { alert('날짜를 선택하세요.'); return; }
  const label = d + (t ? ' ' + t : '');
  if (newDates.find(x => x.label === label)) return;
  newDates.push({ label, date: d, time: t });
  renderTags();
  document.getElementById('newDate').value = '';
  document.getElementById('newTime').value = '';
}
function removeDate(i) { newDates.splice(i, 1); renderTags(); }
function addAttendee() {
  const name = v('newName').trim();
  if (!name) return;
  if (newAttendees.includes(name)) { alert('이미 있는 이름입니다.'); return; }
  newAttendees.push(name);
  renderTags();
  document.getElementById('newName').value = '';
}
function removeAttendee(i) { newAttendees.splice(i, 1); renderTags(); }
function renderTags() {
  const dl = document.getElementById('dateList');
  if (dl) dl.innerHTML = newDates.map((d,i) => `<span class="tag">${esc(d.label)}<button class="remove" onclick="removeDate(${i})">×</button></span>`).join('');
  const nl = document.getElementById('nameList');
  if (nl) nl.innerHTML = newAttendees.map((n,i) => `<span class="tag">${esc(n)}<button class="remove" onclick="removeAttendee(${i})">×</button></span>`).join('');
}
function createMeeting() {
  const title = v('meetingTitle').trim(), desc = v('meetingDesc').trim();
  if (!title) { alert('회의 제목을 입력하세요.'); return; }
  if (!newDates.length) { alert('후보 일정을 하나 이상 추가하세요.'); return; }
  if (!newAttendees.length) { alert('참석 대상자를 한 명 이상 추가하세요.'); return; }
  showLoading('회의 생성 중...');
  const dObj = {}, aObj = {};
  newDates.forEach((d,i) => dObj['d'+i] = d);
  newAttendees.forEach((n,i) => aObj['a'+i] = n);
  const ref = db.ref('meetings').push();
  ref.set({ title, desc, dates: dObj, attendees: aObj, createdAt: Date.now() })
    .then(() => { hideLoading(); location.hash = '#meeting/' + ref.key; })
    .catch(err => { hideLoading(); alert('오류: ' + err.message); });
}

// ── Meeting ───────────────────────────────────────────────────
let meetingData = null, responseListener = null;
function showMeeting(id) {
  if (!db) { showSetupView(); return; }
  currentView = 'meeting'; currentMeetingId = id; currentUser = null;
  setHero('불러오는 중...', '', true);
  showLoading('회의 정보 로딩 중...');
  if (responseListener) { db.ref('meetings/'+id+'/responses').off(); responseListener = null; }
  db.ref('meetings/'+id).once('value').then(snap => {
    hideLoading();
    if (!snap.exists()) { render('<div class="alert alert-warn">회의를 찾을 수 없습니다.</div>'); return; }
    meetingData = { id, ...snap.val() };
    setHero('금요일작은찬양팀 정기모임', '✦ 일상과 기도제목 나누기<br>✦ 찬양팀 운영, 연습, 선곡 및 예배 형식 관련 논의', true);
    renderMeetingView();
  }).catch(err => { hideLoading(); render(`<div class="alert alert-warn">오류: ${err.message}</div>`); });
}

function renderMeetingView() {
  const m = meetingData;
  const dates = m.dates ? Object.entries(m.dates).sort((a,b) => a[1].date.localeCompare(b[1].date)) : [];
  const attendees = m.attendees ? Object.values(m.attendees) : [];
  const shareUrl = location.href.split('#')[0] + '#meeting/' + m.id;

  render(`
    <!-- 이름 선택 -->
    <div class="card">
      <div class="step-head"><div class="step-num-badge">1</div><div><div class="step-title">본인을 선택해주세요</div></div></div>
      <div class="name-grid">
        ${attendees.map(n => `<button class="name-btn${currentUser===n?' selected':''}" onclick="selectUser('${esc(n)}')">${esc(n)}</button>`).join('')}
      </div>
    </div>

    <!-- 날짜 선택 -->
    <div class="card" id="responseCard" style="display:none">
      <div class="step-head">
        <div class="step-num-badge">2</div>
        <div>
          <div class="step-title">참석 가능한 날짜를 선택해주세요</div>
          <div class="step-sub" id="selectedNameBadge">여러 날짜 선택 가능</div>
        </div>
      </div>
      <div class="date-cards" id="dateOptions">
        ${dates.map(([key, d]) => {
          const parts = d.date ? d.date.split('-') : [];
          const mon = parts[1] ? ['','1월','2월','3월','4월','5월','6월','7월','8월','9월','10월','11월','12월'][parseInt(parts[1])] : '';
          const day = parts[2] ? parseInt(parts[2]) : '';
          return `<div class="date-card" id="opt_${key}" onclick="toggleDate('${key}')">
            <div class="date-cal">
              <div class="date-cal-top">${esc(mon)}</div>
              <div class="date-cal-num">${day}</div>
            </div>
            <div class="date-info">
              <div class="date-main">${esc(d.date || d.label)}</div>
              ${d.time ? `<div class="date-time">⏰ ${esc(d.time)}</div>` : ''}
            </div>
            <div class="date-check">✓</div>
          </div>`;
        }).join('')}
      </div>
      <button class="btn btn-success btn-full" onclick="submitResponse()">응답 저장하기</button>
    </div>

    <!-- 현황 -->
    <div class="card">
      <div class="step-head">
        <div class="step-num-badge">3</div>
        <div><div class="step-title">참석 현황</div><div class="step-sub">실시간 업데이트</div></div>
        <div style="margin-left:auto"><button class="btn btn-secondary btn-sm" onclick="loadSummary()">새로고침</button></div>
      </div>
      <div class="grid-wrap" id="summaryGrid"><div style="text-align:center;padding:24px"><div class="spinner" style="margin:0 auto"></div></div></div>
    </div>

    <div style="text-align:center;margin-bottom:20px">
      <button class="btn btn-danger btn-sm" onclick="deleteMeeting()">이 회의 삭제</button>
    </div>
  `);
  loadSummary();
  listenResponses();
}

let selectedDates = new Set();
function selectUser(name) {
  currentUser = name;
  document.querySelectorAll('.name-btn').forEach(b => b.classList.toggle('selected', b.textContent === name));
  document.getElementById('selectedNameBadge').textContent = name + '님, 가능한 날짜를 선택해주세요';
  document.getElementById('responseCard').style.display = '';
  selectedDates.clear();
  db.ref('meetings/'+currentMeetingId+'/responses/'+encName(name)).once('value').then(snap => {
    if (snap.exists()) selectedDates = new Set(snap.val().available || []);
    refreshDateCards();
  });
}
function toggleDate(key) {
  selectedDates.has(key) ? selectedDates.delete(key) : selectedDates.add(key);
  refreshDateCards();
}
function refreshDateCards() {
  document.querySelectorAll('.date-card').forEach(el => {
    el.classList.toggle('selected', selectedDates.has(el.id.replace('opt_','')));
  });
}
function submitResponse() {
  if (!currentUser) { alert('이름을 먼저 선택하세요.'); return; }
  showLoading('저장 중...');
  db.ref('meetings/'+currentMeetingId+'/responses/'+encName(currentUser))
    .set({ name: currentUser, available: [...selectedDates], updatedAt: Date.now() })
    .then(() => { hideLoading(); loadSummary(); showToast('응답이 저장되었습니다! ✓'); })
    .catch(err => { hideLoading(); alert('오류: ' + err.message); });
}
function listenResponses() {
  responseListener = db.ref('meetings/'+currentMeetingId+'/responses');
  responseListener.on('value', () => loadSummary());
}
function loadSummary() {
  const m = meetingData;
  const dates = m.dates ? Object.entries(m.dates).sort((a,b) => a[1].date.localeCompare(b[1].date)) : [];
  const attendees = m.attendees ? Object.values(m.attendees) : [];
  db.ref('meetings/'+currentMeetingId+'/responses').once('value').then(snap => {
    const res = {};
    snap.forEach(c => { const r = c.val(); res[r.name] = new Set(r.available||[]); });
    const counts = {}; dates.forEach(([k]) => counts[k] = 0);
    const rows = attendees.map(name => {
      const avail = res[name];
      const isMe = name === currentUser;
      return `<tr class="${isMe?'my-row':''}"><td>${esc(name)}</td>${dates.map(([k]) => {
        if (!avail) return `<td class="cell-pending">-</td>`;
        const ok = avail.has(k);
        if (ok) counts[k]++;
        return `<td class="${ok?'cell-yes':'cell-no'}">${ok?'○':'✕'}</td>`;
      }).join('')}</tr>`;
    }).join('');
    const el = document.getElementById('summaryGrid');
    if (el) el.innerHTML = `<table class="grid"><thead><tr><th>이름</th>${dates.map(([k,d])=>`<th>${esc(d.date||d.label)}</th>`).join('')}</tr></thead><tbody>${rows}<tr class="count-row"><td>가능 인원</td>${dates.map(([k])=>`<td>${counts[k]}명</td>`).join('')}</tr></tbody></table>`;
  });
}
function deleteMeeting() {
  if (!confirm('이 회의를 삭제하시겠습니까?')) return;
  showLoading('삭제 중...');
  db.ref('meetings/'+currentMeetingId).remove().then(() => { hideLoading(); location.hash = '#'; });
}

// ── Utils ─────────────────────────────────────────────────────
function render(html) { document.getElementById('app').innerHTML = html; }
function v(id) { const e = document.getElementById(id); return e ? e.value : ''; }
function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function today() { return new Date().toISOString().slice(0,10); }
function encName(n) { return encodeURIComponent(n).replace(/\./g,'%2E'); }
function copyUrl(url) { navigator.clipboard.writeText(url).then(() => showToast('링크가 복사되었습니다!')); }
function showToast(msg) {
  const t = document.createElement('div');
  t.className = 'toast'; t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 2500);
}
